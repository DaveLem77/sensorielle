<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionnaire LSQ — Sensorielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--s-ink:#080D25;--s-ink-dim:#62677A;--s-ink-faint:#9b9eac;--s-line:#080d2514;--s-gradient:linear-gradient(100deg,#7157F5 0%,#B94FE4 38%,#F45E9A 68%,#FF8058 100%);--s-display:'Geist','Inter',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:var(--s-ink);font:14px/1.5 'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding:16px}
.card{display:grid;grid-template-columns:1fr 150px;gap:16px;background:#fff;border:1px solid var(--s-line);border-radius:14px;padding:16px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#9b9db0;pointer-events:none}
.search input{width:100%;height:40px;padding:0 14px 0 36px;border-radius:10px;border:1px solid #e2e1ec;background:#faf9fd;font:500 13px inherit;color:#20243b}
.search input:focus-visible{outline:2px solid #7c4dff;outline-offset:1px}
.hint{font-size:10.5px;color:var(--s-ink-faint);margin:0 0 8px}
.results{display:flex;flex-wrap:wrap;gap:6px;max-height:88px;overflow-y:auto}
.results button{border:1px solid #15182b16;border-radius:30px;padding:6px 11px;font-size:11.5px;color:#4b4e5e;background:#f6f5fb;cursor:pointer}
.results button:hover{background:#efedf8}
.results button[aria-pressed="true"]{background:#242137;border-color:#242137;color:#fff}
.stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#15182b}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:7px;bottom:7px;z-index:2;padding:3px 8px;border-radius:100px;background:#0b0f22b3;color:#fff;font-size:9px;font-weight:700;letter-spacing:.03em}
.tag[hidden]{display:none}
.footer{margin-top:10px;text-align:right}
.footer a{font-size:10px;color:var(--s-ink-faint);text-decoration:none}
.footer a:hover{color:#7c4dff}
@media(max-width:420px){.card{grid-template-columns:1fr}.stage{width:110px;margin:0 auto}}
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
      <label class="visually-hidden" for="wInput" style="position:absolute;left:-9999px">Chercher un mot en LSQ</label>
      <input type="text" id="wInput" placeholder="bleu, famille, école…" autocomplete="off">
    </div>
    <p class="hint" id="wHint">Quelques mots pour commencer :</p>
    <div class="results" id="wResults" aria-live="polite"></div>
  </div>
  <div>
    <div class="stage">
      <video id="wVideo" muted playsinline loop preload="none"></video>
      <span class="tag" id="wTag" hidden></span>
    </div>
    <div class="footer"><a href="https://sensorielle.ca" target="_blank" rel="noopener">Propulsé par Sensorielle ↗</a></div>
  </div>
</div>

<script src="/media/signs-data.js"></script>
<script>
(function(){
  // Widget intregrable (2026-10-23, pour la page Entreprises) : version
  // compacte du dictionnaire LSQ du site principal, pensee pour tourner
  // dans l'iframe cree par widget/embed.js sur le site d'une organisation
  // cliente. Meme source de donnees que le site principal
  // (/media/signs-data.js) -- un seul dictionnaire a maintenir.
  var input = document.getElementById("wInput");
  var resultsEl = document.getElementById("wResults");
  var hintEl = document.getElementById("wHint");
  var video = document.getElementById("wVideo");
  var tag = document.getElementById("wTag");
  if (!input || !resultsEl || !video) return;
  var data = window.SENSORIELLE_SPEECH_VIDEOS || {};

  function norm(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function labelFor(key){ if (/^[0-9]+$/.test(key)) return key; return key.charAt(0).toUpperCase() + key.slice(1); }
  var words = Object.keys(data).filter(function(k){ return k.length > 1 && !/^[0-9]+$/.test(k); }).sort(function(a,b){ return norm(a).localeCompare(norm(b)); });
  var defaults = ["bonjour","famille","content","maison","bleu","école"].filter(function(w){ return data[w]; });
  var selected = null;

  function reportHeight(){
    try {
      window.parent.postMessage({ sensorielleWidgetHeight: document.documentElement.scrollHeight }, "*");
    } catch (e) {}
  }

  function selectWord(key){
    if (!data[key]) return;
    selected = key;
    video.src = data[key];
    video.load();
    video.play().catch(function(){});
    tag.hidden = false;
    tag.textContent = labelFor(key);
    render(input.value);
  }

  function render(query){
    resultsEl.innerHTML = "";
    var trimmed = query.trim();
    var q = norm(trimmed);
    var matches = q ? words.filter(function(w){ return norm(w).indexOf(q) !== -1; }) : defaults;
    hintEl.textContent = !trimmed
      ? "Quelques mots pour commencer :"
      : matches.length
        ? matches.length + " mot" + (matches.length > 1 ? "s trouvés" : " trouvé")
        : "Aucun mot trouvé pour « " + trimmed + " ».";
    matches.slice(0, 10).forEach(function(w){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", String(w === selected));
      b.textContent = labelFor(w);
      b.addEventListener("click", function(){ selectWord(w); });
      resultsEl.appendChild(b);
    });
    reportHeight();
  }

  input.addEventListener("input", function(){ render(input.value); });
  // Meme logique que le dictionnaire du site principal (David n'aime pas
  // que ce soit toujours le meme mot au demarrage) : un mot au hasard.
  if (words.length) selectWord(words[Math.floor(Math.random() * words.length)]);
  else if (defaults.length) selectWord(defaults[Math.floor(Math.random() * defaults.length)]);
  else render("");

  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
})();
</script>
</body>
</html>
