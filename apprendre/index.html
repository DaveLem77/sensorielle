<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apprendre la LSQ — Sensorielle</title>
<meta name="description" content="Apprends la langue des signes québécoise avec Sensorielle : vocabulaire et grammaire, en petites leçons, à ton rythme.">
<link rel="icon" type="image/png" href="../media/favicon.png">
<link rel="apple-touch-icon" href="../media/favicon.png">
<style>
:root{
  --s-bg:#F8F9FF; --s-surface:#fff; --s-bg-alt:#F4F1FD;
  --s-ink:#080D25; --s-ink-dim:#62677A; --s-ink-faint:#85899c;
  --s-line:#080d2514; --s-line-strong:#080d2528;
  --s-violet:#7C4DFF; --s-violet-deep:#5B34D6; --s-violet-wash:#7c4dff12;
  --s-pink:#E853D7; --s-orange:#FF8058;
  --s-gradient:linear-gradient(100deg,#7157F5 0%,#B94FE4 38%,#F45E9A 68%,#FF8058 100%);
  --s-display:'Geist','Inter',-apple-system,sans-serif;
  --s-green:#2BB673; --s-green-deep:#1C8F58; --s-red:#F2454C; --s-red-deep:#C9333A; --s-gold:#F5B82E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{
  font-family:var(--s-display);
  background:var(--s-bg);
  color:var(--s-ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img,video{max-width:100%}
svg{display:block}
::selection{background:var(--s-violet-wash)}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em}

/* ---------------------------------------------------------------- ambient bg */
.ambient{
  position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:var(--s-bg);
}
.ambient::before{
  content:"";position:absolute;top:-30%;right:-15%;width:70%;height:60%;border-radius:50%;
  background:radial-gradient(circle, #7C4DFF14 0%, transparent 70%);
}
.ambient::after{
  content:"";position:absolute;bottom:-20%;left:-15%;width:60%;height:50%;border-radius:50%;
  background:radial-gradient(circle, #FF805812 0%, transparent 70%);
}

/* ---------------------------------------------------------------- header */
.top-bar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:14px max(20px,env(safe-area-inset-left,0px)) 14px max(20px,env(safe-area-inset-right,0px));
  background:rgba(248,249,255,.86); backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--s-line);
}
.top-bar .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:-.01em; flex:0 0 auto}
.top-bar .brand img{height:19px;width:auto;display:block}
.top-bar .brand .sep{color:var(--s-ink-faint);font-weight:500;margin:0 1px}
.top-bar .brand .sub{color:var(--s-ink-dim);font-weight:600}
.top-bar .spacer{flex:1}
.stat-chip{
  display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;
  padding:7px 12px;border-radius:999px;background:var(--s-surface);
  border:1px solid var(--s-line-strong);
}
.stat-chip.streak{color:#D9690F}
.stat-chip.streak .icon{color:#FF8058}
.stat-chip.xp{color:var(--s-violet-deep)}
.stat-chip.xp .icon{color:var(--s-violet)}
.stat-chip .icon{width:15px;height:15px}

.account-chip{position:relative;flex:0 0 auto}
.account-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--s-gradient);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:none;
}
.account-menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:var(--s-surface);
  border-radius:14px;box-shadow:0 20px 45px -15px rgba(11,15,34,.3);border:1px solid var(--s-line-strong);
  padding:12px;z-index:50;
}
.account-menu[hidden]{display:none}
.account-menu .email{font-size:11.5px;color:var(--s-ink-dim);padding:2px 6px 10px;border-bottom:1px solid var(--s-line);margin-bottom:8px;word-break:break-all}
.account-menu button{width:100%;text-align:left;background:none;border:none;padding:9px 6px;border-radius:8px;font:600 13px var(--s-display);color:#a4302a;cursor:pointer}
.account-menu button:hover{background:#fdeeee}

/* ---------------------------------------------------------------- auth gate */
.gate-wrap{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:28px max(18px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:380px}
.gate-hero{
  border-radius:26px 26px 0 0;padding:30px 28px 26px;background:var(--s-gradient);color:#fff;position:relative;overflow:hidden;
}
.gate-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 88% -15%, rgba(255,255,255,.22), transparent 55%)}
.gate-hero .eyebrow{position:relative;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 8px}
.gate-hero h1{position:relative;font-size:23px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.gate-hero p{position:relative;margin:0;font-size:13.5px;opacity:.9;line-height:1.55}
.gate-form{background:var(--s-surface);border-radius:0 0 26px 26px;padding:24px 26px 26px;border:1px solid var(--s-line-strong);border-top:none;box-shadow:0 20px 50px -24px rgba(8,13,37,.25)}
.gate-field{margin-bottom:12px}
.gate-field label{display:block;font-size:12.5px;font-weight:700;color:var(--s-ink-dim);margin-bottom:6px}
.gate-field input{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--s-line-strong);font:inherit;font-size:14.5px;color:var(--s-ink);background:var(--s-bg)}
.gate-field input:focus{outline:none;border-color:var(--s-violet)}
.gate-submit{width:100%;padding:14px;border-radius:13px;border:none;font-weight:800;font-size:15px;background:var(--s-violet);color:#fff;box-shadow:0 4px 0 var(--s-violet-deep);margin-top:4px}
.gate-submit:active{transform:translateY(3px);box-shadow:none}
.gate-toggle{width:100%;text-align:center;background:none;border:none;padding:12px 0 2px;font-size:13px;font-weight:600;color:var(--s-violet-deep)}
.gate-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:11.5px;color:var(--s-ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gate-divider::before,.gate-divider::after{content:"";flex:1;height:1px;background:var(--s-line-strong)}
.gate-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:13px;border:1.5px solid var(--s-line-strong);background:var(--s-surface);font-weight:700;font-size:14px;color:var(--s-ink)}
.gate-google svg{width:18px;height:18px}
.gate-msg{font-size:12.5px;margin:10px 2px 0;line-height:1.5}
.gate-msg.err{color:var(--s-red-deep)}
.gate-msg.ok{color:var(--s-green-deep)}

/* ---------------------------------------------------------------- home */
.home-wrap{max-width:660px;margin:0 auto;padding:26px max(18px,env(safe-area-inset-left,0px)) 80px max(18px,env(safe-area-inset-right,0px))}
.hero{
  border-radius:26px; padding:30px 28px; margin-bottom:30px;
  background:var(--s-gradient); color:#fff; position:relative; overflow:hidden;
  box-shadow:0 18px 40px -16px rgba(91,52,214,.45);
}
.hero::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(120% 140% at 88% -15%, rgba(255,255,255,.22), transparent 55%);
}
.hero .eyebrow{position:relative;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 10px}
.hero h1{font-size:25px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em;position:relative;line-height:1.15}
.hero p{margin:0;font-size:14px;opacity:.9;max-width:440px;line-height:1.55;position:relative}

.world-tabs{display:flex;gap:8px;margin-bottom:8px;position:sticky;top:62px;z-index:10;background:var(--s-bg);padding:6px 0 14px}
.world-tab{
  flex:1;padding:13px 10px;border-radius:15px;border:1.5px solid var(--s-line-strong);
  background:var(--s-surface);font-weight:700;font-size:13.5px;color:var(--s-ink-dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;
}
.world-tab .n{font-size:11px;font-weight:600;opacity:.7}
.world-tab.active{background:var(--s-ink);border-color:var(--s-ink);color:#fff}
.world-tab.active .n{opacity:.65;color:#fff}
.world-tab:not(.active):hover{border-color:var(--s-ink-faint)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-head h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--s-ink-faint);font-weight:700;margin:0}
.section-head .count{font-size:12px;color:var(--s-ink-faint);font-weight:700}
.palier-note{margin:-4px 2px 16px;font-size:12.5px;color:var(--s-ink-dim);line-height:1.5}

/* ---------------------------------------------------------------- lesson list (remplace le "parcours") */
.lesson-list{display:flex;flex-direction:column;gap:9px}
.lesson-row{
  display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:18px;
  background:var(--s-surface);border:1px solid var(--s-line-strong);
  box-shadow:0 1px 2px rgba(8,13,37,.03);
  transition:transform .12s, box-shadow .12s, border-color .12s; text-align:left; width:100%;
}
.lesson-row.available{cursor:pointer}
.lesson-row.available:hover{border-color:var(--s-violet);box-shadow:0 8px 22px -10px rgba(124,77,255,.35);transform:translateY(-1px)}
.lesson-row.available:active{transform:translateY(0px) scale(.993)}
.lesson-row.locked{opacity:.55}
.lesson-row.done{border-color:#E8D9A8;background:linear-gradient(180deg,#FFFCF4,#fff)}

.row-badge{
  flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14.5px;letter-spacing:-.02em;
}
.lesson-row.locked .row-badge{background:var(--s-bg-alt);color:var(--s-ink-faint)}
.lesson-row.locked .row-badge .icon{width:18px;height:18px}
.lesson-row.available .row-badge{background:var(--s-gradient);color:#fff}
.lesson-row.done .row-badge{background:linear-gradient(135deg,var(--s-gold),#E8980F);color:#fff}
.lesson-row.done .row-badge .icon{width:19px;height:19px}

.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:15px;color:var(--s-ink);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--s-ink-faint);font-weight:600;margin-top:2px}

.row-end{flex:0 0 auto;display:flex;align-items:center;gap:8px;color:var(--s-ink-faint)}
.row-end .stars{display:flex;gap:1px;color:var(--s-gold)}
.row-end .stars .icon{width:13px;height:13px}
.row-end .stars .icon.off{color:var(--s-line-strong)}
.row-end .chevron{width:17px;height:17px;color:var(--s-ink-faint)}

/* ---------------------------------------------------------------- lesson overlay */
.lesson-overlay{
  position:fixed;inset:0;background:var(--s-bg);z-index:100;display:none;
  flex-direction:column;
}
.lesson-overlay.open{display:flex}
.lesson-top{
  display:flex;align-items:center;gap:14px;padding:16px max(18px,env(safe-area-inset-left,0px));
}
.lesson-close{width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--s-ink-faint);display:flex;align-items:center;justify-content:center}
.lesson-close .icon{width:18px;height:18px}
.lesson-close:hover{background:var(--s-line)}
.progress-track{flex:1;height:12px;border-radius:999px;background:var(--s-line-strong);overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:var(--s-gradient);width:0%;transition:width .35s cubic-bezier(.4,0,.2,1)}
.lesson-hearts{display:flex;gap:4px}
.lesson-hearts .icon{width:17px;height:17px;color:var(--s-red)}
.lesson-hearts .icon.lost{color:var(--s-line-strong)}

.lesson-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:10px max(18px,env(safe-area-inset-left,0px)) 140px}
.ex-wrap{max-width:540px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;justify-content:center}
.ex-kicker{font-size:12.5px;font-weight:700;color:var(--s-ink-faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.ex-prompt{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 20px;line-height:1.3}

.video-stage{
  width:100%;max-width:272px;margin:0 auto 20px;border-radius:22px;overflow:hidden;
  background:var(--s-bg-alt); aspect-ratio:720/1094; position:relative; box-shadow:0 10px 26px rgba(8,13,37,.12);
  border:1px solid var(--s-line);
}
.video-stage video{width:100%;height:100%;object-fit:contain;display:block;background:var(--s-bg-alt)}
.video-stage .replay{
  position:absolute;bottom:10px;right:10px;width:36px;height:36px;border-radius:50%;
  background:rgba(8,13,37,.78);border:none;display:flex;align-items:center;justify-content:center;
}
.video-stage .replay .icon{width:16px;height:16px;color:#fff}

.teach-badge{
  position:absolute;top:10px;left:10px;background:var(--s-ink);color:#fff;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;padding:5px 9px;border-radius:999px;
}

.word-card{
  background:var(--s-surface);border-radius:26px;padding:34px 22px;text-align:center;
  box-shadow:0 10px 26px rgba(8,13,37,.07); border:1px solid var(--s-line);margin-bottom:20px;
}
.word-card .mot{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--s-ink)}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.choices.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice-btn{
  width:100%;text-align:left;padding:15px 17px;border-radius:15px;border:2px solid var(--s-line-strong);
  background:var(--s-surface);font-size:15.5px;font-weight:600;color:var(--s-ink);
  display:flex;align-items:center;gap:10px;transition:.12s;
}
.choice-btn:hover:not(:disabled){border-color:var(--s-violet)}
.choice-btn:active:not(:disabled){transform:scale(.98)}
.choice-btn.correct{border-color:var(--s-green);background:#EBFBF2;color:var(--s-green-deep)}
.choice-btn.incorrect{border-color:var(--s-red);background:#FDEDEE;color:var(--s-red-deep)}
.choice-btn.video-choice{aspect-ratio:720/1094;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;position:relative;background:var(--s-bg-alt)}
.choice-btn.video-choice video{width:100%;height:100%;object-fit:contain;background:var(--s-bg-alt)}

.vf-row{display:flex;gap:10px;margin-top:26px}
.vf-btn{flex:1;padding:18px;border-radius:17px;border:2px solid var(--s-line-strong);background:var(--s-surface);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.vf-btn .icon{width:17px;height:17px}
.vf-btn.vrai .icon{color:var(--s-green)}
.vf-btn.faux .icon{color:var(--s-red)}
.vf-btn.vrai:hover:not(:disabled){border-color:var(--s-green)}
.vf-btn.faux:hover:not(:disabled){border-color:var(--s-red)}
.vf-btn.correct{border-color:var(--s-green);background:#EBFBF2;color:var(--s-green-deep)}
.vf-btn.incorrect{border-color:var(--s-red);background:#FDEDEE;color:var(--s-red-deep)}

.card-screen{display:flex;flex-direction:column;flex:1;justify-content:center}
.card-screen .card-ic{width:46px;height:46px;border-radius:14px;background:var(--s-gradient);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.card-screen .card-ic .icon{width:22px;height:22px}
.card-screen h3{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 14px;line-height:1.3}
.card-screen .card-body{font-size:15.5px;line-height:1.65;color:var(--s-ink-dim)}
.card-screen .card-body b{color:var(--s-ink);font-weight:700}
.card-screen .card-body i{color:var(--s-violet-deep);font-style:normal;font-weight:600}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.match-tile{
  border-radius:15px;border:2px solid var(--s-line-strong);background:var(--s-surface);
  padding:14px;font-weight:700;font-size:14.5px;text-align:center;min-height:58px;
  display:flex;align-items:center;justify-content:center;transition:.12s;
}
.match-tile.video-tile{padding:0;overflow:hidden;aspect-ratio:720/1094;position:relative;background:var(--s-bg-alt)}
.match-tile.video-tile video{width:100%;height:100%;object-fit:contain;background:var(--s-bg-alt)}
.match-tile.sel{border-color:var(--s-violet);box-shadow:0 0 0 3px var(--s-violet-wash)}
.match-tile.matched{border-color:var(--s-green);opacity:.4;pointer-events:none}
.match-tile.video-tile.matched{opacity:.35}
.match-tile.wrong-flash{border-color:var(--s-red)}

.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:16px max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-bottom,0px));
  background:var(--s-bg);
  box-shadow:0 -8px 24px -12px rgba(8,13,37,.12);
  border-top:1px solid var(--s-line);
}
.bottom-bar.feedback-correct{background:#EBFBF2;border-top-color:#CBEEDA}
.bottom-bar.feedback-incorrect{background:#FDEDEE;border-top-color:#F6D3D5}
.feedback-row{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-weight:800;font-size:15.5px}
.feedback-row .icon{width:19px;height:19px}
.feedback-row.correct{color:var(--s-green-deep)}
.feedback-row.incorrect{color:var(--s-red-deep)}
.feedback-sub{font-size:13px;font-weight:500;color:var(--s-ink-dim);margin:-6px 0 12px}
.btn-primary{
  width:100%;padding:16px;border-radius:15px;border:none;font-weight:800;font-size:15.5px;
  background:var(--s-violet);color:#fff;box-shadow:0 4px 0 var(--s-violet-deep);transition:.12s;
}
.btn-primary:active{transform:translateY(3px);box-shadow:none}
.btn-primary.go{background:var(--s-green);box-shadow:0 4px 0 var(--s-green-deep)}
.btn-primary.stop{background:var(--s-red);box-shadow:0 4px 0 var(--s-red-deep)}

/* ---------------------------------------------------------------- summary */
.summary-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.summary-wrap .big-ic{width:76px;height:76px;border-radius:50%;background:var(--s-gradient);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 14px 30px -10px rgba(124,77,255,.5)}
.summary-wrap .big-ic.fail{background:linear-gradient(135deg,var(--s-red),#D13A42);box-shadow:0 14px 30px -10px rgba(242,69,76,.5)}
.summary-wrap .big-ic .icon{width:36px;height:36px}
.summary-wrap h2{font-size:25px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.summary-wrap p.sub{color:var(--s-ink-dim);margin:0 0 26px;font-size:14.5px}
.summary-stats{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.summary-stat{background:var(--s-surface);border:1px solid var(--s-line-strong);border-radius:17px;padding:15px 19px;min-width:92px}
.summary-stat .v{font-size:21px;font-weight:800;color:var(--s-violet-deep);display:flex;align-items:center;justify-content:center;gap:4px}
.summary-stat .v .icon{width:14px;height:14px;color:var(--s-gold)}
.summary-stat .l{font-size:11px;color:var(--s-ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* ---------------------------------------------------------------- confetti */
.confetti-piece{position:fixed;top:-12px;z-index:200;pointer-events:none;border-radius:2px}

@media (max-width:480px){
  .hero h1{font-size:21px}
  .word-card .mot{font-size:27px}
  .row-title{font-size:14.5px}
}
</style>
</head>

<div class="ambient"></div>

<div class="top-bar">
