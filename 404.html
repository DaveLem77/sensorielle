<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Sensorielle</title>
<meta name="description" content="Cette page n'existe pas ou plus. Retournez à l'accueil de Sensorielle pour essayer la traduction LSQ-français.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f3f2f8">
<link rel="icon" href="/media/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--s-bg:#F8F9FF;--s-surface:#fff;--s-ink:#080D25;--s-ink-dim:#62677A;--s-line:#080d2514;--s-display:'Geist','Inter',sans-serif;--s-gradient:linear-gradient(100deg,#7157F5 0%,#B94FE4 38%,#F45E9A 68%,#FF8058 100%)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--s-bg);color:var(--s-ink);font:15px/1.7 'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:#5B34D6;text-decoration:underline}
.wrap{width:min(720px,92%);margin-inline:auto}
header{padding:22px 0;border-bottom:1px solid var(--s-line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand img{height:30px;width:30px;object-fit:contain}
.brand span{font-family:var(--s-display);font-weight:600;font-size:19px;letter-spacing:-.5px;color:var(--s-ink);text-decoration:none}
main{flex:1;display:flex;align-items:center;padding:48px 0 70px;text-align:center}
main .inner{width:100%}
.eyebrow{font-size:10.5px;letter-spacing:1.6px;background:var(--s-gradient);background-clip:text;-webkit-background-clip:text;color:transparent;font-weight:700;text-transform:uppercase;margin:0 0 14px}
h1{font-family:var(--s-display);font-size:clamp(32px,5vw,46px);font-weight:600;letter-spacing:-.04em;margin:0 0 16px}
p{font-size:15px;color:var(--s-ink-dim);line-height:1.8;max-width:46ch;margin:0 auto 30px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none}
.btn-primary{background:var(--s-gradient);color:#fff}
.btn-secondary{background:#fff;color:var(--s-ink);border:1px solid var(--s-line)}
footer{padding:0 0 40px;text-align:center}
footer a{font-size:12px}
</style>
</head>
<body>
<header class="wrap">
  <a class="brand" href="/">
    <img src="/media/favicon.png" alt="">
    <span>Sensorielle</span>
  </a>
</header>
<main class="wrap">
  <div class="inner">
    <p class="eyebrow">Erreur 404</p>
    <h1>Cette page n'existe pas.</h1>
    <p>Le lien est peut-être brisé ou la page a été déplacée. Retournez à l'accueil pour essayer la traduction LSQ-français, ou consultez le dictionnaire des signes disponibles.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Retour à l'accueil</a>
      <a class="btn btn-secondary" href="/collector/">Contribuer un signe</a>
    </div>
  </div>
</main>
<footer class="wrap">
  <a href="/confidentialite/">Confidentialité</a> · <a href="/conditions/">Conditions</a>
</footer>
</body>
</html>
